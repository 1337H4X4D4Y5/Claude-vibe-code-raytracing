name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/implement-geometry-paper-KGhKS
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp version.json
        run: |
          cat > version.json <<EOF
          {
            "sha":       "${GITHUB_SHA}",
            "shortSha":  "${GITHUB_SHA:0:7}",
            "ref":       "${GITHUB_REF_NAME}",
            "runNumber": ${GITHUB_RUN_NUMBER},
            "buildTime": "$(date -u +%FT%TZ)"
          }
          EOF
          cat version.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Site root is the repo root -- everything we need (index.html,
          # style.css, src/) lives there. We exclude folders Pages doesn't
          # need to host.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
